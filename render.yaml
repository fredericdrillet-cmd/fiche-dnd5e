# Déploiement « Blueprint » sur Render (offre gratuite) : Render lit ce fichier automatiquement.
services:
  - type: web
    name: fiche-dnd5e
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
